<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Herominutes evolution timeline</title>
<desc id="d">Three website feedback rounds, each before a build stage: full-stack web app, PWA, then native iOS app in TestFlight. External testing has not started.</desc>
<rect width="1200" height="370" rx="14" fill="#0f172a"/>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">How Herominutes evolved: a website round before every stage</text>
<line x1="100" y1="175" x2="1100" y2="175" stroke="#334155" stroke-width="3"/>
<circle cx="100" cy="175" r="24" fill="#111c33" stroke="#fbbf24" stroke-width="2.5"/>
<text x="100" y="181" text-anchor="middle" font-size="17" font-weight="800" fill="#fbbf24">1</text>
<text x="100" y="137" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fbbf24">~2024</text>
<text x="100" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="100" dy="0">Website round 1:</tspan><tspan x="100" dy="17">vibe-coded, to test</tspan><tspan x="100" dy="17">the idea</tspan></text>
<rect x="198" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#60a5fa" stroke-width="2.5"/>
<text x="266" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="266" dy="0">Full-stack web</tspan><tspan x="266" dy="18">app</tspan></text>
<text x="266" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#60a5fa">~Q4 2025</text>
<text x="266" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="266" dy="0">Built after round 1</tspan><tspan x="266" dy="17">showed demand</tspan></text>
<circle cx="433" cy="175" r="24" fill="#111c33" stroke="#fbbf24" stroke-width="2.5"/>
<text x="433" y="181" text-anchor="middle" font-size="17" font-weight="800" fill="#fbbf24">2</text>
<text x="433" y="137" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fbbf24">~Q4 2025</text>
<text x="433" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="433" dy="0">Website round 2:</tspan><tspan x="433" dy="17">feedback on the web</tspan><tspan x="433" dy="17">app</tspan></text>
<rect x="532" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#60a5fa" stroke-width="2.5"/>
<text x="600" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="600" dy="0">PWA</tspan></text>
<text x="600" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#60a5fa">~Q1 2026</text>
<text x="600" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="600" dy="0">Installable web app</tspan></text>
<circle cx="766" cy="175" r="24" fill="#111c33" stroke="#fbbf24" stroke-width="2.5"/>
<text x="766" y="181" text-anchor="middle" font-size="17" font-weight="800" fill="#fbbf24">3</text>
<text x="766" y="137" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fbbf24">~Q1 2026</text>
<text x="766" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="766" dy="0">Website round 3:</tspan><tspan x="766" dy="17">feedback on the PWA</tspan></text>
<rect x="865" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#4ade80" stroke-width="2.5"/>
<text x="933" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="933" dy="0">Native iOS app</tspan></text>
<text x="933" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4ade80">~Q2 2026</text>
<text x="933" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="933" dy="0">TestFlight, invite-</tspan><tspan x="933" dy="17">only beta</tspan></text>
<rect x="1032" y="141" width="136" height="68" rx="12" fill="#111c33" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1100" y="171" font-size="14.5" fill="#f8fafc" text-anchor="middle" font-weight="700" xml:space="preserve"><tspan x="1100" dy="0">External</tspan><tspan x="1100" dy="18">testing</tspan></text>
<text x="1100" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8">Not started</text>
<text x="1100" y="237" font-size="12.5" fill="#cbd5e1" text-anchor="middle" xml:space="preserve"><tspan x="1100" dy="0">TBD</tspan></text>
<text x="600" y="322" text-anchor="middle" font-size="13" fill="#94a3b8">Quarters are approximate. Where GitHub history exists it matches; the earliest website rounds predate my use of GitHub.</text>
</svg>
